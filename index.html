<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0a0f" />
    <meta
      name="description"
      content="Busque filmes e séries populares por nome, veja nota, sinopse e detalhes com dados da TMDB."
    />
    <title>Buscador de Filmes & Séries</title>
  </head>
  <body>
    <!--
      THESIS: a movie search tool with the confident, information-dense energy
      of a real entertainment database/portal — not a mood board, not a quiet
      artifact. Rating is a universal gold badge, not a decoration.
      OWN-WORLD: near-black ground, one vivid cinematic red as the sole brand/
      action accent, gold reserved only for the rating badge (the genre's own
      convention, seen across IMDb/JustWatch/Filmow); Anton carries big
      display moments, Archivo carries everything else — bold, condensed,
      no serif, no handwriting.
      STORY: a visitor recognizes a real movie/TV catalog at a glance, scans
      a dense poster grid with rating badges already visible, searches or
      opens a title for the full record (genres, runtime, synopsis).
      FIRST VIEWPORT: bold uppercase wordmark under a red rule, pill type
      toggle + pill search field, poster grid starting immediately below
      with gold rating badges on every card.
      FORM: synthesized from real references the user supplied (Filmow,
      JustWatch, IMDb, Omelete) rather than an abstract direction round —
      common threads (dark ground, vivid badge colors, bold sans, dense
      grids) fused into one original system, not a clone of any one site.
      FINISH: unreviewed and undocumented is unfinished; this build ends
      with the finish review, the verdict, and DESIGN.md kept current.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
